apiVersion: apps/v1
kind: Deployment
metadata:
 name: deployment
 labels:
   deployment: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      deployment: demo
  template:
    metadata:
      labels:
        deployment: demo
    spec:
      containers:
      - name: container
        image: simplehttp:1.0.0
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: DB
          valueFrom:
            configMapKeyRef:
              name: map
              key: mysqlDB